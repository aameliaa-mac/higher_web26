<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>Beds</title>

    <script>
        function showContemporary() {
            document.getElementById("one").style.display = "none";
            document.getElementById("two").style.display = "block";
        }

        function showHandiMaxi() {
            document.getElementById("one").style.display = "block";
            document.getElementById("two").style.display = "none";
        }
    </script>
</head>

<body>

    <img
        class="button"
        src="bed1.png"
        width="300"
        height="275"
        onclick="showHandiMaxi()"
        alt="HandiMaxi bed"
    >

    <p id="one" style="display: none">
        A bed custom made by HandiMaxi anchors this master bedroom
        in this customer's house, decorated by our decorating partners.
    </p>

    <img
        class="button"
        src="bed2.jpg"
        width="300"
        height="275"
        onclick="showContemporary()"
        alt="Contemporary wooden bed"
    >

    <p id="two" style="display: none">
        This bed has a sleek, modern wooden feel. It contains a
        high, comfortable bed frame with soft pillows.
    </p>

</body>
</html>
